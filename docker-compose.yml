# 本体数据库（ADR-0006）：Postgres 16 + pgvector。端口 5433，避开本机已有的 Postgres。
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: autobiz-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: autobiz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autobiz}   # 安装脚本生成随机密码；默认值兼容既有实例
      POSTGRES_DB: autobiz
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["autobiz-pgdata:/var/lib/postgresql/data"]
volumes:
  autobiz-pgdata:
