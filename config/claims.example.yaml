# 个人可宣称事实台账（ADR-0016）：复制为 $AUTOBIZ_HOME/config/claims.yaml 后改成你自己的。
# 内容快产线的体检规则：稿子里凡是"我 / 本人"+ 成绩数字（带万/千/百/%/倍，或两位数以上）或经历动词（开过 / 亏掉 / 服务过 …）
# 的句子，必须能在这里找到依据——keywords 至少命中一个，且句中每个数字都出现在 claim 或 numbers 里。否则体检不过。
# 没写进来的经历和数字，AI 一律不许替你说（防止编造"我从 0 做到 3 万粉"这类履历）。
- id: example_store
  claim: 自己开过一家奶茶店，第一年亏了 8 万
  keywords: [奶茶店, 亏]
  numbers: [8万, 八万]
