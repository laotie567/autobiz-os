# 面向使用者的完整栈（数据库 + 应用容器）。开发实例仍用根目录 docker-compose.yml（仅数据库）。
# 用法见 scripts/install.sh，或手动：
#   cp .env.example .env && 填 POSTGRES_PASSWORD / DEEPSEEK_API_KEY
#   docker compose -f docker-compose.app.yml up -d db
#   docker compose -f docker-compose.app.yml build app
#   ./bin/autobiz init && ./bin/autobiz doctor
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: autobiz-db
    environment:
      POSTGRES_USER: autobiz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: autobiz
    ports: ["127.0.0.1:${AUTOBIZ_DB_PORT:-5433}:5432"]   # 只绑本机，不得暴露公网
    volumes: ["autobiz-pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "autobiz"], interval: 5s, retries: 20 }

  app:
    # 预构建镜像发布在 ghcr.io（国际仓）；build 段保留作拉取失败时的本地回退
    image: ghcr.io/laotie567/autobiz-os:1.0.1
    build: { context: ., dockerfile: docker/Dockerfile }
    container_name: autobiz-app
    env_file: .env
    environment:
      DATABASE_URL: postgresql://autobiz:${POSTGRES_PASSWORD}@db:5432/autobiz
      AUTOBIZ_HOME: /workspace
      AUTOBIZ_MODEL_CACHE: /models
    volumes:
      - ${AUTOBIZ_HOST_HOME:?install.sh 会写入绝对路径}:/workspace
    depends_on:
      db: { condition: service_healthy }

volumes:
  autobiz-pgdata: {}
