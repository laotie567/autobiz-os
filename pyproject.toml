[project]
name = "autobiz"
dynamic = ["version"]
description = "AutoBiz OS — ontology-driven AI native business system"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "pyyaml>=6",
  "openai>=1.40",
  "mcp>=1.2,<2",
  "fastembed>=0.4",
  "python-dotenv>=1",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
autobiz = "autobiz.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "autobiz/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
